<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a050f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.6);
            transition: transform 0.3s, background-color 0.3s;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            max-width: 90%;
        }
        #start-btn:hover {
            background-color: #ff0040;
            transform: scale(1.05);
        }
        .small-text {
            font-size: 15px;
            opacity: 0.9;
            font-weight: normal;
            margin-top: 3px;
        }
        
        /* Mesaj Kutusu Tasarımı */
        #message-container {
            display: none;
            z-index: 10;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 51, 102, 0.2);
            box-sizing: border-box;
            backdrop-filter: blur(8px); /* Şık buzlu cam efekti */
            animation: fadeIn 1.2s ease-out; /* Ekrana yumuşak giriş animasyonu */
        }

        /* Ekrana giriş animasyonu */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            color: #ff99aa;
            margin-top: 0;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ffd9e2;
            margin: 10px 0;
        }
        
        /* Gül yaprağı stili */
        .petal {
            position: absolute;
            background-color: #ff1a40;
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
            animation: fall linear infinite;
            z-index: 1;
        }
        
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
            }
        }

        /* TELEFON İÇİN ZARİF GÖRÜNÜM (MOBİL DÜZELTMELERİ) */
        @media (max-width: 768px) {
            #start-btn {
                padding: 12px 25px;
                font-size: 16px;
            }
            .small-text {
                font-size: 13px;
            }
            #message-container {
                padding: 35px 25px;
                width: 85%; /* Kenarlardan boşluk bırakır, ekrana yapışmaz */
            }
            h1 {
                font-size: 1.5rem; /* Devasa başlığı çok daha zarif bir boyuta küçülttük */
                margin-bottom: 15px;
            }
            p {
                font-size: 0.95rem; /* Metni kibar ve okunaklı hale getirdik */
                line-height: 1.6;
            }
        }
    </style>
</head>
<body>

    <button id="start-btn">
        Sana bir mesajım var Birtanem🤍
        <span class="small-text">Benim için sesini biraz açar mısın?</span>
    </button>

    <div id="message-container">
        <h1>Seni Çok Seviyorum...</h1>
        <p>Hayatıma kattığın her güzellik, yüzümdeki her tebessüm senin eserin.</p>
        <p>İyi ki varsın, iyi ki benimlesin Nefesim 🫶</p>
    </div>

    <!-- Mobilde müziğin çalışması için gerekli altyapı -->
    <audio id="bg-music" loop preload="auto">
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startBtn = document.getElementById('start-btn');
        const messageContainer = document.getElementById('message-container');
        const bgMusic = document.getElementById('bg-music');

        startBtn.addEventListener('click', () => {
            // Sesi başlatma
            bgMusic.load();
            let playPromise = bgMusic.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {}).catch(error => {
                    console.log("Tarayıcı sesi engelledi:", error);
                });
            }

            // Arayüz geçişi
            startBtn.style.display = 'none';
            messageContainer.style.display = 'block';
            createPetals();
        });

        function createPetals() {
            const colors = ['#ff3366', '#ff0040', '#cc0033'];
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                const size = Math.random() * 15 + 10; 
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                petal.style.top = `-30px`;
                petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                petal.style.animationDuration = `${Math.random() * 3 + 5}s`; 
                document.body.appendChild(petal);
                setTimeout(() => {
                    petal.remove();
                }, 8000);
            }, 250); 
        }
    </script>
</body>
</html>
